name: Auto Update Sports M3U & Matches JSON API

on:
  schedule:
    # Runs hourly to refresh live match scores/fixtures; full stream health check runs every 6 hours
    - cron: "0 * * * *"
  workflow_dispatch: # Allows manual 1-click run from GitHub Actions tab
  push:
    branches:
      - main
      - master
    paths:
      - "config.json"
      - "generator.py"
      - "matches_generator.py"

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh Sports Streams (Every 6h) & Match JSON API (Hourly)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HOUR=$(date -u +%H)
          if [ "${{ github.event_name }}" != "schedule" ] || [ $((10#$HOUR % 6)) -eq 0 ]; then
            echo "Running full 6-hour M3U stream health check..."
            python generator.py
          else
            echo "Hourly tick: keeping verified streams and refreshing live match schedules & scores..."
          fi
          python matches_generator.py

      - name: Commit and Push Updated Playlists & JSON API
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --staged --quiet; then
            echo "No playlist or schedule changes detected."
          else
            git commit -m "chore: auto-update sports M3U & matches.json API [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
