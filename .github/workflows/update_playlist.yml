name: Auto Update Sports M3U (Every 6 Hours)

on:
  schedule:
    # Runs automatically every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch: # Allows manual 1-click run from GitHub Actions tab
  push:
    branches:
      - main
      - master
    paths:
      - "config.json"
      - "generator.py"

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate & Verify Sports M3U Playlists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python generator.py

      - name: Commit and Push Updated Playlists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --staged --quiet; then
            echo "No playlist changes detected."
          else
            git commit -m "chore: auto-update Football & Cricket M3U playlists [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

