name: Auto Update Sports M3U & Matches JSON API

on:
  schedule:
    # Runs hourly to refresh live match scores/fixtures; full stream health check runs every ~6 hours
    - cron: "0 * * * *"
  workflow_dispatch: # Allows manual 1-click run from GitHub Actions tab
  push:
    branches:
      - main
      - master
    paths:
      - "config.json"
      - "generator.py"
      - "matches_generator.py"

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh Sports Streams (Every 6h) & Match JSON API (Hourly)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          SHOULD_SCAN=$(python -c "
          import datetime, json, os
          if os.environ.get('EVENT_NAME') != 'schedule' or not os.path.exists('output/status.json'):
              print('yes')
          else:
              try:
                  st = json.load(open('output/status.json', encoding='utf-8'))
                  last = datetime.datetime.fromisoformat(st['updated_at_utc'])
                  age_sec = (datetime.datetime.now(datetime.timezone.utc) - last).total_seconds()
                  print('yes' if age_sec >= 19800 else 'no')
              except Exception:
                  print('yes')
          ")
          if [ "$SHOULD_SCAN" = "yes" ]; then
            echo "Running full 6-hour M3U stream health check..."
            python generator.py
          else
            echo "Streams verified < 5.5h ago; refreshing live match schedules & scores..."
          fi
          python matches_generator.py

      - name: Commit and Push Updated Playlists & JSON API
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --staged --quiet; then
            echo "No playlist or schedule changes detected."
          else
            git commit -m "chore: auto-update sports M3U & matches.json API [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
